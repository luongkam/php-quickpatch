      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #states-8-root { font-family: var(--font-sans); color: var(--color-ink); }
      #states-8-root .diagram-container { width: 100%;
