      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--color-muted);
      font-family: var(--font-mono); }</style>
    <pattern id="states-8-state-dots" width="22" height="22" patternUnits="userSpaceOnUse">
